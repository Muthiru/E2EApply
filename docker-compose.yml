services:
  postgres:
    image: postgres:16
    container_name: e2e-apply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: e2eapply
      POSTGRES_PASSWORD: e2eapply_dev
      POSTGRES_DB: e2eapply
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - e2eapply_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2eapply -d e2eapply"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  e2eapply_pgdata:
